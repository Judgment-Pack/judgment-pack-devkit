# Vendor as .github/workflows/ci.yml. Runs the repository's own check list (dev.json)
# with scripts/dev/check.sh, with the toolchains set up from the manifest and no caps.
name: dev-check
run-name: dev-check ${{ inputs.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Updated pull request head to check
        required: true
        type: string
      pull_request:
        description: Pull request whose updated head is being checked
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("go=" + ("true" if "go" in tc else "false"))
          print("goversion=" + tc.get("go", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          echo "gomod=$(git ls-files go.mod '*/go.mod' | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.dev.outputs.node != ''
        with:
          node-version: ${{ steps.dev.outputs.node }}
      # The Go release is the manifest's (toolchains.go.version); a manifest that names none falls
      # back to the go directive of the repository's go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.dev.outputs.go == 'true' && steps.dev.outputs.goversion != ''
        with:
          go-version: ${{ steps.dev.outputs.goversion }}
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.dev.outputs.go == 'true' && steps.dev.outputs.goversion == ''
        with:
          go-version-file: ${{ steps.dev.outputs.gomod }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      # A step with requires_env fails under CI when its variable is empty, unless the step is
      # marked optional in dev.json. A repository whose dev.json has a parity step sets the
      # variable here: a shallow checkout of the other repository, then the variable pointing at
      # it (a private repository needs a token with read access). Uncomment and adapt:
      #
      # - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      #   with:
      #     repository: Judgment-Pack/judgment-pack-desk
      #     ref: the commit the parity table was made against
      #     path: desk-checkout
      #     fetch-depth: 1
      #     persist-credentials: false
      #     token: ${{ secrets.DESK_READ_TOKEN }}
      # - name: Name the checkout for the parity step
      #   run: echo "JPDEV_DESK=$GITHUB_WORKSPACE/desk-checkout" >> "$GITHUB_ENV"
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      - name: Checks
        run: scripts/dev/check.sh --all

  handover:
    name: handover
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - name: Read dispatched pull request metadata
        if: github.event_name == 'workflow_dispatch'
        id: pull
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pullNumber = Number(context.payload.inputs.pull_request);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed('pull_request must be a positive integer');
              return;
            }
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pullNumber,
            });
            core.setOutput('base', pull.data.base.sha);
            core.setOutput('body', pull.data.body || '');
      - name: Check boundary paths and run the schema probe
        env:
          JPDEV_HANDOVER_BASE: ${{ github.event.pull_request.base.sha || steps.pull.outputs.base }}
          JPDEV_PR_BODY: ${{ github.event.pull_request.body || steps.pull.outputs.body }}
        run: scripts/dev/handover_check.sh

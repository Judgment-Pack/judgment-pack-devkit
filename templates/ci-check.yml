# Vendor as .github/workflows/dev-check.yml. Runs the repository's own check list (dev.json)
# with scripts/dev/check.sh, with the toolchains set up from the manifest and no caps.
name: dev-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("go=" + ("true" if "go" in tc else "false"))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          echo "gomod=$(git ls-files go.mod '*/go.mod' | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.dev.outputs.node != ''
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.dev.outputs.go == 'true'
        with:
          go-version-file: ${{ steps.dev.outputs.gomod }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      - name: Checks
        run: scripts/dev/check.sh --all

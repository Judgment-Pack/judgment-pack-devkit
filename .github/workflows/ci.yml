name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the kit's own vendored runner). The two
# jobs keep their names, which branch protection requires: `lint` runs the cheap steps, `tests` the
# kit's test run.

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so the release runs the tagged commit's own jobs.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Whitespace; no machine-local path in tracked text; CLAUDE.md is AGENTS.md and the root
      # copy starts with the template; every script parses; the JSON documents parse; shellcheck
      # (the program the runner image carries).
      - name: The lint steps of dev.json
        run: scripts/dev/check.sh --all --only diff-check,local-paths,agent-docs,bash-n,json,shellcheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The kit's tests (jpdev check and check.sh on the fixture, the caps, the record gate)
        run: scripts/dev/check.sh --only tests
